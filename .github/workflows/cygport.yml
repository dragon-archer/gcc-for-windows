name: Build Cygwin packages

on:
  workflow_call:
    inputs:
      combination:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.combination }}
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
    env:
      CHERE_INVOKING: '1'
      COMBINATION: ${{ inputs.combination }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Cygwin
        id: cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          platform: x86_64
          install-dir: C:\cygwin
          packages: >-
            cygport calm gcc-core gcc-g++ gcc-fortran binutils make patch diffutils
            tar xz gzip curl git autoconf automake libtool gettext-devel
            bison flex gperf texinfo python3 python3-devel
            libgmp-devel libmpfr-devel libmpc-devel libisl-devel
            zlib-devel libzstd-devel libiconv-devel libintl-devel
            ${{ inputs.combination == 'cygwin' && 'gcc-ada=14.4.0-1' || 'mingw64-x86_64-binutils mingw64-x86_64-headers mingw64-x86_64-runtime mingw64-x86_64-winpthreads mingw64-x86_64-windows-default-manifest' }}

      - name: Download prepared sources
        uses: actions/download-artifact@v4
        with:
          name: gcc-sources
          path: work/sources

      - name: Build with cygport
        id: build
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash .github/scripts/build-cygport.sh "$COMBINATION"

      - name: Diagnose build directory locks
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        shell: pwsh
        run: |
          $logDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/logs'
          New-Item -ItemType Directory -Force $logDir | Out-Null
          & {
            Get-ChildItem 'C:\cygwin\gcc-build' -Directory | ForEach-Object {
              $buildDir = Join-Path $_.FullName 'build'
              foreach ($path in @($buildDir, "$buildDir\gcc", "$buildDir\stage1-gcc")) {
                if (Test-Path $path) {
                  Get-Item $path | Format-List FullName, Attributes
                  Get-Acl $path | Format-List Path, Owner, AccessToString
                }
              }
            }
            Get-CimInstance Win32_Process |
              Where-Object { $_.ExecutablePath -like '*gcc-build*' -or $_.Name -match '^(make|bash|sh|gcc|g\+\+|cc1.*|collect2|ld|as)\.exe$' } |
              Format-List ProcessId, ParentProcessId, ExecutablePath, CommandLine
            $archive = Join-Path $env:RUNNER_TEMP 'Handle.zip'
            $tools = Join-Path $env:RUNNER_TEMP 'gfw-handle'
            Invoke-WebRequest 'https://download.sysinternals.com/files/Handle.zip' -OutFile $archive
            Expand-Archive $archive -DestinationPath $tools -Force
            & "$tools\handle64.exe" -accepteula -nobanner gcc-build
          } *>&1 | Tee-Object -FilePath "$logDir/build-locks.log"

      - name: Upload Cygwin packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.combination }}-packages
          path: artifacts/packages/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Prepare local repository
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash .github/scripts/install-cygport.sh prepare

      - name: Save official package baseline
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash .github/scripts/report-cygport.sh snapshot

      - name: Install built packages
        env:
          CYGWIN_SETUP: ${{ steps.cygwin.outputs.setup }}
          CYGWIN_ROOT: C:\cygwin
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash .github/scripts/install-cygport.sh

      - name: Compare installed packages
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash .github/scripts/report-cygport.sh report

      - name: Run smoke tests
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash .github/scripts/run-tests.sh "$COMBINATION" "$COMBINATION"

      - name: Collect cygport logs
        if: ${{ always() && steps.cygwin.outcome == 'success' }}
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          mkdir -p artifacts/logs
          for log in /var/log/setup.log /var/log/setup.log.full; do
            if [[ -f ${log} ]]; then
              cp "${log}" "artifacts/logs/setup-native-${log##*/}"
            fi
          done
          if [[ -d /gcc-build ]]; then
            find /gcc-build -type f \( -name '*.log' -o -name '*.sum' \) -print0 |
              tar --null -T - -czf artifacts/logs/cygport-diagnostics.tar.gz
          fi

      - name: Upload Cygwin logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.combination }}-logs
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
