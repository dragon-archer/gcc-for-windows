name: Build GCC packages

on:
  workflow_call:
    inputs:
      combination:
        type: string
        required: true
      environments:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.environment }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environments) }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.environment }}
          update: true
          install: base-devel git

      - name: Enable staging repository
        run: |
          grep -qFx '[staging]' /etc/pacman.conf || sed -i '/^# \[staging\]/,/^$/ s|^# ||g' /etc/pacman.conf

      - name: Update from staging (core)
        shell: cmd
        run: msys2 -c "pacman --noconfirm -Suuy"

      - name: Update from staging (rest)
        shell: cmd
        run: msys2 -c "pacman --noconfirm -Suu"

      - name: Download prepared sources
        uses: actions/download-artifact@v8
        with:
          name: gcc-sources
          path: work/sources

      - name: Prepare, build and package GCC
        env:
          COMBINATION: ${{ inputs.combination }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: bash .github/scripts/build-makepkg.sh "${COMBINATION}" "${ENVIRONMENT}"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.combination }}-${{ matrix.environment }}-packages
          path: artifacts/packages/*.pkg.tar.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Install built packages
        run: pacman -U --noconfirm artifacts/packages/*.pkg.tar.*

      - name: Compare packages with official repository
        env:
          COMBINATION: ${{ inputs.combination }}
        run: bash .github/scripts/report-makepkg.sh "$COMBINATION"

      - name: Run smoke tests
        env:
          COMBINATION: ${{ inputs.combination }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: bash .github/scripts/run-tests.sh "$COMBINATION" "$ENVIRONMENT"

      - name: Collect configure and test logs
        if: always()
        run: |
          mkdir -p artifacts/logs
          msys_root=$(cygpath -m /)
          build_dir=$(cygpath -u "${msys_root%%/*}/gcc-build")
          if [[ -d ${build_dir}/src ]]; then
            find "${build_dir}/src" -type f \( -name config.log -o -name '*.sum' -o -name '*.log' \) \
              -print0 | tar --null -T - -czf artifacts/logs/build-diagnostics.tar.gz
          fi

      - name: Upload logs and effective recipe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.combination }}-${{ matrix.environment }}-logs
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
